name: partiduo
version: 0.1.10

description: |
  Partiduo — comptabilité et facturation en Crystal.
  Socle et modules activables, sans interface : le contrat Partiduo::Api
  est consommé par un dépôt d'interface (partiduo-ui-bulma).

authors:
  - Philippe Nénert <it+claude.ai@aloli.fr>

crystal: ">= 1.19.1"

license: AGPL-3.0-or-later

targets:
  partiduo-manage:
    main: manage.cr

dependencies:
  # Shards maison sur GitHub (aloli-crystal), suivis par branche ; en
  # développement local, scripts/override-local.sh les remplace par les
  # copies de travail de prod-crystal.
  marten:
    github: aloli-crystal/marten
    branch: production
  marten_auth:
    github: aloli-crystal/marten-auth
    branch: main
  pg:
    github: will/crystal-pg
  authn:
    github: aloli-crystal/authn
    branch: production
  # password-policy et jose sont aussi requis par authn et webauthn avec une
  # contrainte de version, que shards ne concilie pas avec une branche : ils
  # suivent donc les étiquettes publiées, avec la même contrainte.
  password-policy:
    github: aloli-crystal/password-policy
    version: "~> 0.1"
  totp:
    github: aloli-crystal/totp
    branch: production
  webauthn:
    github: aloli-crystal/webauthn
    branch: production
  jose:
    github: aloli-crystal/jose
    version: "~> 0.2"
  saml:
    github: aloli-crystal/saml
    branch: production
  # Lot F : PDF/A-3 Factur-X (ADR-006 D5) et son contrôle.
  pdf-a:
    github: aloli-crystal/pdf-a
    branch: production
  pdf-validate:
    github: aloli-crystal/pdf-validate
    branch: production

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
